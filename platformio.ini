; BLE MIDI Adapter: BLE MIDI devices to USB MIDI, no PC needed

[env:esp32s3]
; pioarduino: Arduino core 3.x, which ships USBMIDI (TinyUSB) for the S3
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
; SuperMini-style S3 boards usually carry 4 MB flash
board_upload.flash_size = 4MB
board_build.partitions = default.csv
lib_deps =
    h2zero/NimBLE-Arduino@^2.3.0
; USB_MODE=0: native USB driven by TinyUSB (OTG), not the serial/JTAG peripheral.
; CDC off so the USB host sees a plain MIDI-only device. Logs go to UART0 (TX=GPIO43).
build_unflags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=3
    '-DUSB_PRODUCT="BLE MIDI Adapter"'
    ; arduino-esp32 USB lib needs FS.h, which the PlatformIO LDF does not resolve for it
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src
monitor_speed = 115200

[env:native]
; host-side unit tests for the MIDI parser and formatter: pio test -e native
platform = native
test_framework = unity

[env:esp32s3-debug]
; Bench testing on a PC: USB MIDI plus a CDC serial console on the same cable.
extends = env:esp32s3
build_unflags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
build_flags =
    ${env:esp32s3.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; GPIO0 is not a known-good button on every dev board
    -DFORGET_BUTTON_PIN=-1
    -DLOG_RAW_BLE
; the CDC port accepts the 1200 baud touch, so reflashing needs no button
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes

[env:m5cores3]
; M5Stack CoreS3 with the touch screen UI. Keeps the CDC console for easy reflashing.
extends = env:esp32s3-debug
board = m5stack-cores3
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
lib_deps =
    ${env:esp32s3.lib_deps}
    m5stack/M5Unified@^0.2.29
build_flags =
    ${env:esp32s3.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DFORGET_BUTTON_PIN=-1
    -DHAS_SCREEN
    -DLOG_STATUS
